{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">{{ heading }}</h4>
        <!-- One template serves both Add and Edit. `expense` is None when adding. -->
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" required
                   value="{{ request.form.title or (expense.title if expense else '') }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Amount (₹)</label>
            <input type="number" step="0.01" min="0.01" name="amount" class="form-control" required
                   value="{{ request.form.amount or (expense.amount if expense else '') }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            {% set current = request.form.category or (expense.category if expense else '') %}
            <select name="category" class="form-select" required>
              {% for c in categories %}
                <option value="{{ c }}" {% if c == current %}selected{% endif %}>{{ c }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" name="date" class="form-control" required
                   value="{{ request.form.date or (expense.date if expense else today) }}">
          </div>
          <button class="btn btn-primary">Save</button>
          <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
